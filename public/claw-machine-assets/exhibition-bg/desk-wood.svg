<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e9d8"/>
      <stop offset="100%" stop-color="#efe2cf"/>
    </linearGradient>
    <linearGradient id="woodGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c9a0"/>
      <stop offset="35%" stop-color="#d9b384"/>
      <stop offset="100%" stop-color="#c79b6a"/>
    </linearGradient>
    <filter id="grain3" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.09" numOctaves="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0.12 0" in="n" result="cn"/>
      <feComposite operator="in" in="cn" in2="SourceGraphic" result="c"/>
      <feBlend mode="multiply" in="c" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#roomWall)"/>

  <!-- 书架暗示 -->
  <rect x="40" y="70" width="160" height="230" rx="8" fill="#cda878" opacity="0.55"/>
  <line x1="40" y1="135" x2="200" y2="135" stroke="#a9805280" stroke-width="6"/>
  <line x1="40" y1="200" x2="200" y2="200" stroke="#a9805280" stroke-width="6"/>
  <line x1="40" y1="265" x2="200" y2="265" stroke="#a9805280" stroke-width="6"/>
  <rect x="56" y="90" width="14" height="40" fill="#8a6a44" opacity="0.5"/>
  <rect x="78" y="86" width="14" height="44" fill="#9c7a52" opacity="0.5"/>
  <rect x="120" y="92" width="14" height="38" fill="#8a6a44" opacity="0.5"/>

  <!-- 桌面 -->
  <path d="M40 340 L760 340 L720 1100 L80 1100 Z" fill="url(#woodGrad3)" filter="url(#grain3)"/>
  <path d="M40 340 L760 340 L760 360 L40 360 Z" fill="#fff" opacity="0.25"/>
  <path d="M40 340 L760 340 L720 620 L80 620 Z" fill="#000" opacity="0.08"/>
  <ellipse cx="540" cy="320" rx="300" ry="180" fill="#fff" opacity="0.18"/>
  <path d="M80 1100 L110 1100 L120 1160 L90 1160 Z" fill="#a98052" opacity="0.7"/>
  <path d="M690 1100 L720 1100 L710 1160 L680 1160 Z" fill="#a98052" opacity="0.7"/>
  <g stroke="#b78a5a" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M60 440 Q400 460 740 430"/>
    <path d="M65 580 Q400 600 735 570"/>
    <path d="M70 720 Q400 740 730 710"/>
    <path d="M75 860 Q400 880 725 850"/>
  </g>
</svg>
