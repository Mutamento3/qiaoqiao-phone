<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="softWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="55%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="woodGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="30%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f5d9e8"/>
    </linearGradient>
    <filter id="grain5" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0 0.8  0 0 0 0.08 0" in="n" result="cn"/>
      <feComposite operator="in" in="cn" in2="SourceGraphic" result="c"/>
      <feBlend mode="multiply" in="c" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#softWall)"/>

  <!-- 柔光圆点装饰 -->
  <circle cx="160" cy="140" r="60" fill="#fff" opacity="0.3"/>
  <circle cx="650" cy="100" r="44" fill="#fbcfe8" opacity="0.35"/>
  <circle cx="600" cy="240" r="30" fill="#a7f3d0" opacity="0.3"/>

  <!-- 桌面 -->
  <path d="M40 320 L760 320 L720 1100 L80 1100 Z" fill="url(#woodGrad5)" filter="url(#grain5)"/>
  <path d="M40 320 L760 320 L760 340 L40 340 Z" fill="#fff" opacity="0.4"/>
  <path d="M40 320 L760 320 L720 600 L80 600 Z" fill="#000" opacity="0.05"/>
  <ellipse cx="540" cy="300" rx="300" ry="180" fill="#fff" opacity="0.3"/>
  <path d="M80 1100 L110 1100 L120 1160 L90 1160 Z" fill="#d9b8cf" opacity="0.7"/>
  <path d="M690 1100 L720 1100 L710 1160 L680 1160 Z" fill="#d9b8cf" opacity="0.7"/>
  <g stroke="#e7c3d8" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M60 420 Q400 440 740 410"/>
    <path d="M65 560 Q400 580 735 550"/>
    <path d="M70 700 Q400 720 730 690"/>
    <path d="M75 840 Q400 860 725 830"/>
  </g>
</svg>
