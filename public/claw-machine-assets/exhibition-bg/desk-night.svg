<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="nightWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="woodGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e7d3bb"/>
      <stop offset="30%" stop-color="#d8bfa0"/>
      <stop offset="100%" stop-color="#c4a884"/>
    </linearGradient>
    <linearGradient id="winNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="grain4" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0.1 0" in="n" result="cn"/>
      <feComposite operator="in" in="cn" in2="SourceGraphic" result="c"/>
      <feBlend mode="multiply" in="c" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#nightWall)"/>

  <!-- 夜景窗台 -->
  <rect x="250" y="60" width="300" height="220" rx="14" fill="#1e293b"/>
  <rect x="262" y="72" width="276" height="196" rx="8" fill="url(#winNight)"/>
  <circle cx="470" cy="130" r="22" fill="#fde68a"/>
  <circle cx="470" cy="130" r="34" fill="#fde68a" opacity="0.18"/>
  <g fill="#fef9c3">
    <circle cx="310" cy="110" r="2.5"/><circle cx="350" cy="150" r="2"/>
    <circle cx="300" cy="180" r="1.8"/><circle cx="390" cy="120" r="2.2"/>
    <circle cx="430" cy="200" r="1.6"/><circle cx="500" cy="190" r="2"/>
    <circle cx="330" cy="220" r="1.8"/><circle cx="460" cy="100" r="1.6"/>
  </g>
  <line x1="400" y1="72" x2="400" y2="268" stroke="#1e293b" stroke-width="6"/>
  <line x1="262" y1="170" x2="538" y2="170" stroke="#1e293b" stroke-width="6"/>

  <!-- 桌面 -->
  <path d="M40 320 L760 320 L720 1100 L80 1100 Z" fill="url(#woodGrad4)" filter="url(#grain4)"/>
  <path d="M40 320 L760 320 L760 340 L40 340 Z" fill="#fff" opacity="0.3"/>
  <path d="M40 320 L760 320 L720 600 L80 600 Z" fill="#000" opacity="0.07"/>
  <ellipse cx="560" cy="300" rx="300" ry="180" fill="#bae6fd" opacity="0.12"/>
  <path d="M80 1100 L110 1100 L120 1160 L90 1160 Z" fill="#b89a76" opacity="0.7"/>
  <path d="M690 1100 L720 1100 L710 1160 L680 1160 Z" fill="#b89a76" opacity="0.7"/>
  <g stroke="#cbb393" stroke-width="1.5" opacity="0.28" fill="none">
    <path d="M60 420 Q400 440 740 410"/>
    <path d="M65 560 Q400 580 735 550"/>
    <path d="M70 700 Q400 720 730 690"/>
    <path d="M75 840 Q400 860 725 830"/>
  </g>
</svg>
