<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- 天空/墙壁渐变 -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>

    <!-- 桌面木纹渐变 -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="30%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5c0"/>
    </linearGradient>

    <!-- 桌面远深阴影 -->
    <linearGradient id="depthShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <!-- 柔和光斑 -->
    <radialGradient id="lightSpot" cx="70%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- 木纹噪点滤镜 -->
    <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0.12 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="composite"/>
      <feBlend mode="multiply" in="composite" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- 背景墙面 -->
  <rect width="800" height="1200" fill="url(#wallGrad)"/>

  <!-- 桌面主体（带轻微透视） -->
  <path d="M40 320 L760 320 L720 1100 L80 1100 Z" fill="url(#woodGrad)" filter="url(#woodGrain)"/>

  <!-- 桌面边缘高光 -->
  <path d="M40 320 L760 320 L760 340 L40 340 Z" fill="#fff" opacity="0.35"/>

  <!-- 桌面远深阴影 -->
  <path d="M40 320 L760 320 L720 600 L80 600 Z" fill="url(#depthShadow)" opacity="0.6"/>

  <!-- 左侧桌腿阴影 -->
  <path d="M80 1100 L110 1100 L120 1160 L90 1160 Z" fill="#c7b299" opacity="0.7"/>
  <!-- 右侧桌腿阴影 -->
  <path d="M690 1100 L720 1100 L710 1160 L680 1160 Z" fill="#c7b299" opacity="0.7"/>

  <!-- 桌面柔和光斑 -->
  <ellipse cx="560" cy="300" rx="300" ry="180" fill="url(#lightSpot)" opacity="0.7"/>

  <!-- 极淡木纹线条 -->
  <g stroke="#d4c4b0" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M60 400 Q400 420 740 390"/>
    <path d="M65 480 Q400 500 735 470"/>
    <path d="M70 560 Q400 580 730 550"/>
    <path d="M75 640 Q400 660 725 630"/>
    <path d="M80 720 Q400 740 720 710"/>
    <path d="M85 800 Q400 820 715 790"/>
    <path d="M90 880 Q400 900 710 870"/>
    <path d="M95 960 Q400 980 705 950"/>
  </g>

  <!-- 右下角无水印区域：用桌面自然渐变遮挡任何可能的水印 -->
  <rect x="550" y="1000" width="250" height="200" fill="url(#woodGrad)" opacity="0"/>
</svg>