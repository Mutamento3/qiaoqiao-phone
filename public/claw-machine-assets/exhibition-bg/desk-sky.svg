<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="skyWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="woodGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="30%" stop-color="#f3e3cf"/>
      <stop offset="100%" stop-color="#e6d2bb"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="grain2" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0.1 0" in="n" result="cn"/>
      <feComposite operator="in" in="cn" in2="SourceGraphic" result="c"/>
      <feBlend mode="multiply" in="c" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#skyWall)"/>

  <!-- 窗户 -->
  <rect x="250" y="60" width="300" height="220" rx="14" fill="#fff" opacity="0.9"/>
  <rect x="262" y="72" width="276" height="196" rx="8" fill="url(#windowSky)"/>
  <circle cx="480" cy="130" r="26" fill="#fff" opacity="0.85"/>
  <ellipse cx="330" cy="170" rx="40" ry="16" fill="#fff" opacity="0.7"/>
  <ellipse cx="400" cy="200" rx="52" ry="18" fill="#fff" opacity="0.55"/>
  <line x1="400" y1="72" x2="400" y2="268" stroke="#fff" stroke-width="6"/>
  <line x1="262" y1="170" x2="538" y2="170" stroke="#fff" stroke-width="6"/>

  <!-- 桌面 -->
  <path d="M40 320 L760 320 L720 1100 L80 1100 Z" fill="url(#woodGrad2)" filter="url(#grain2)"/>
  <path d="M40 320 L760 320 L760 340 L40 340 Z" fill="#fff" opacity="0.35"/>
  <path d="M40 320 L760 320 L720 600 L80 600 Z" fill="#000" opacity="0.06"/>
  <ellipse cx="560" cy="300" rx="300" ry="180" fill="#fff" opacity="0.25"/>
  <path d="M80 1100 L110 1100 L120 1160 L90 1160 Z" fill="#c7b299" opacity="0.7"/>
  <path d="M690 1100 L720 1100 L710 1160 L680 1160 Z" fill="#c7b299" opacity="0.7"/>
  <g stroke="#d4c4b0" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M60 420 Q400 440 740 410"/>
    <path d="M65 560 Q400 580 735 550"/>
    <path d="M70 700 Q400 720 730 690"/>
    <path d="M75 840 Q400 860 725 830"/>
  </g>
</svg>
