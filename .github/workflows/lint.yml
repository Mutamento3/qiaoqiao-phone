name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 质量门禁 CI 兜底: 本地 pre-commit 可能被绕过, 这里再卡一次
# 仅 error 失败 (当前为 0, 见 ESLint 配置); warning 不阻断, 用于暴露技术债
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint
